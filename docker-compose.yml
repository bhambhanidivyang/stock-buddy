# Stock Buddy — Oracle Cloud Free Tier / single VM
# Postgres stays on the private compose network (no host port publish).
# Backend + frontend publish ports for browser access.
#
# Env: backend/.env (Nest + Compose). Service env_file injects into containers.
# For OCI custom NEXT_PUBLIC_API_URL / host ports:
#   docker compose --env-file backend/.env up -d --build

name: stock-buddy

services:
  postgres:
    image: postgres:16-alpine
    container_name: stock-buddy-postgres
    env_file:
      - ./backend/.env
    # Do NOT re-map POSTGRES_* via ${...} — that needs a root .env for
    # Compose interpolation. env_file alone supplies them to the container.
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    # Intentionally NOT published to the host — only reachable as hostname "postgres"
    networks:
      - stock-buddy-net
    healthcheck:
      # $$ → expand inside the container from env_file (not Compose interpolation)
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stock-buddy-backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      PORT: 3000
    ports:
      - "${BACKEND_HOST_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - stock-buddy-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Must be reachable from the user's browser (public IP / DNS), not "backend"
        # Default works locally; for OCI set NEXT_PUBLIC_API_URL in backend/.env
        # and pass --env-file backend/.env on build.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    container_name: stock-buddy-frontend
    environment:
      PORT: 3001
      HOSTNAME: 0.0.0.0
    ports:
      - "${FRONTEND_HOST_PORT:-3001}:3001"
    depends_on:
      - backend
    networks:
      - stock-buddy-net
    restart: unless-stopped

networks:
  stock-buddy-net:
    driver: bridge

volumes:
  postgres_data:
